<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>How are you today?</title>
    <style>
        @font-face {
            font-family: 'Quicksand Bold';
            src: url('./fonts/Quicksand-Bold.ttf') format('truetype');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        :root {
            --card-width: 260px; --card-height: 320px;
            --shadow-card: 0 12px 36px rgba(0,0,0,0.1); --radius-lg: 28px;
            --transition-flip: 0.7s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Quicksand Bold', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #fce4ec 25%, #e3f2fd 50%, #f8bbd0 75%, #bbdefb 100%);
            background-size: 400% 400%; animation: gradientShift 20s ease infinite;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 10px; position: relative; overflow-x: hidden;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        .bg-cloud {
            position: fixed; background: rgba(255,255,255,0.65); border-radius:50%;
            pointer-events: none; z-index:0; opacity:0.5; animation: floatCloud 25s infinite;
        }
        .bg-cloud:nth-child(1) { width:160px; height:70px; top:5%; left:3%; background:#e3f2fd; }
        .bg-cloud:nth-child(2) { width:130px; height:55px; top:12%; right:5%; background:#fce4ec; animation-delay:-10s; }
        .bg-cloud:nth-child(3) { width:150px; height:65px; top:55%; left:6%; background:#e8eaf6; animation-delay:-18s; }
        .bg-cloud:nth-child(4) { width:120px; height:50px; top:70%; right:8%; background:#f3e5f5; animation-delay:-6s; }
        .bg-cloud:nth-child(5) { width:180px; height:75px; top:32%; left:78%; background:#e1f5fe; animation-delay:-22s; }
        .bg-cloud::before, .bg-cloud::after { content:''; position:absolute; background:inherit; border-radius:50%; }
        .bg-cloud::before { width:55%; height:90%; top:-40%; left:18%; }
        .bg-cloud::after { width:40%; height:70%; top:-25%; left:48%; }
        @keyframes floatCloud {
            0%,100%{transform:translateX(0);} 25%{transform:translateX(35px);}
            50%{transform:translateX(-15px);} 75%{transform:translateX(30px);}
        }
        .main-container {
            position:relative; z-index:10; width:100%; max-width:950px;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(25px);
            border-radius: var(--radius-lg); box-shadow:0 15px 40px rgba(100,120,160,0.12);
            padding:18px 28px 14px; border:1px solid rgba(255,255,255,0.8);
            display:flex; flex-direction:column; align-items:center;
        }
        .game-title h1 {
            font-size:2.8rem; font-weight:700; color:#3d5a80;
            background: linear-gradient(135deg, #5c8dcb, #e8698a);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin:0 0 6px 0;
        }
        .progress-section { width:100%; max-width:600px; margin-bottom:12px; }
        .progress-info {
            display:flex; justify-content:space-between; align-items:center;
            font-size:0.9rem; color:#3d5a80; font-weight:700; min-height:32px;
        }
        .progress-right { display:flex; align-items:center; gap:8px; }
        .progress-bar-outer { width:100%; height:12px; background:#e0e8f0; border-radius:20px; overflow:hidden; }
        .progress-bar-inner {
            height:100%; background: linear-gradient(90deg, #7eb8da, #f098b9);
            border-radius:20px; transition: width 0.5s; width:0%;
        }
        .card-stage {
            display:flex; justify-content:center; align-items:center; perspective:1000px;
            margin-bottom:16px; min-height:320px;
        }
        .card-wrapper {
            width: var(--card-width); height: var(--card-height); position:relative;
            transform-style: preserve-3d; transition: transform var(--transition-flip); cursor:pointer;
        }
        .card-wrapper.flipped { transform: rotateY(180deg); }
        .card-face {
            position:absolute; top:0; left:0; width:100%; height:100%;
            backface-visibility: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .card-front { background: #ffffff; border:5px solid #c8ddf0; z-index:2; }
        .card-front .avatar-full {
            width:90%; height:90%; object-fit: contain;
            border-radius: calc(var(--radius-lg) - 5px); display:block;
        }
        .card-back {
            background: linear-gradient(145deg, #ffffff, #f5f0fa); border:5px solid #c5b9d8;
            transform: rotateY(180deg); z-index:1; flex-direction:column; gap:10px; padding:16px;
        }
        .card-back .answer-word { font-size:2.8rem; font-weight:700; text-transform: lowercase; }
        .card-back .answer-word.happy { color:#e8698a; } .card-back .answer-word.sad { color:#5c8dcb; }
        .card-back .answer-word.angry { color:#d94a5a; } .card-back .answer-word.sleepy { color:#7c6dad; }
        .card-back .im-label { font-size:1.6rem; font-weight:700; color:#3d5a80; }
        .card-back .emoji-big { font-size:3.2rem; animation:popIn 0.4s ease; }
        @keyframes popIn { 0%{transform:scale(0.3);opacity:0;} 100%{transform:scale(1);opacity:1;} }
        .correct-banner {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
            font-size:4rem; font-weight:700; color:#e8698a;
            text-shadow:3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff;
            z-index:300; pointer-events:none; opacity:0;
            transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.4s ease;
        }
        .correct-banner.show { transform:translate(-50%,-50%) scale(1.2); opacity:1; }
        .options-section {
            display:flex; flex-wrap:wrap; justify-content:center; gap:12px;
            margin-bottom:8px; width:100%; max-width:600px;
        }
        .option-btn {
            flex:1 1 100px; min-width:90px; max-width:130px; padding:14px 6px;
            font-size:1.1rem; font-weight:700; border:3px solid #d4e2f2;
            border-radius:24px; background:#ffffff; color:#3d5a80; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; gap:4px;
            box-shadow:0 6px 18px rgba(100,120,160,0.1); transition:all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background:#f0f5fb; border-color:#7eb8da; transform:translateY(-3px); }
        .option-btn:disabled { opacity:0.6; cursor:not-allowed; }
        .option-btn .option-emoji { font-size:1.8rem; }
        .option-btn.correct-selected { background:#e0f0ea; border-color:#7eb8a8; color:#2d5a4d; }
        .option-btn.wrong-selected {
            background:#fde8ec; border-color:#e88595; color:#a83d4d; animation:shake 0.5s ease;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0);} 15%{transform:translateX(-8px);} 30%{transform:translateX(8px);}
            45%{transform:translateX(-6px);} 60%{transform:translateX(5px);} 75%{transform:translateX(-3px);}
        }
        .btn-next {
            background:#7eb8da; color:white; padding:0 16px; font-size:0.9rem;
            height:28px; line-height:28px; border-radius:20px; border:none;
            cursor:pointer; font-weight:700; display:inline-flex; align-items:center;
        }
        .feedback-area { text-align:center; min-height:24px; font-weight:700; font-size:1rem; margin-top:6px; }
        .feedback-area.correct-fb { color:#4a8d7a; } .feedback-area.error-fb { color:#c45a6a; }
        .start-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(30,40,60,0.6); z-index:200; display:flex;
            justify-content:center; align-items:center;
        }
        .start-card {
            background:#fff; border-radius:40px; padding:50px 45px;
            text-align:center; box-shadow:0 30px 70px rgba(40,50,80,0.25);
        }
        .start-card h2 { font-size:2.2rem; color:#3d5a80; margin-bottom:25px; }
        .btn-start {
            background:#e8698a; color:white; padding:16px 45px; font-size:1.4rem;
            border-radius:40px; border:none; cursor:pointer; font-weight:700;
        }
        .completion-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(30,40,60,0.6); z-index:100; justify-content:center;
            align-items:center; padding:30px;
        }
        .completion-overlay.show { display:flex; }
        .completion-card {
            background:#fff; border-radius:36px; padding:45px 35px;
            text-align:center; box-shadow:0 30px 80px rgba(40,50,80,0.25);
        }
        .completion-card h2 { font-size:2rem; color:#3d5a80; }
        .completion-card .trophy { font-size:4.5rem; }
        .completion-stats { font-size:1.1rem; color:#5d6d80; margin:15px 0 25px; }
        .completion-stats strong { color:#e8698a; }
        .confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:150; }
        .confetti-piece {
            position:absolute; width:12px; height:12px; border-radius:4px;
            animation:confettiFall 3s ease-out forwards;
        }
        @keyframes confettiFall {
            0%{transform:translateY(-120px) rotate(0deg) scale(1);opacity:1;}
            100%{transform:translateY(110vh) rotate(720deg) scale(0.3);opacity:0;}
        }
    </style>
</head>
<body>
<div class="bg-cloud"></div><div class="bg-cloud"></div><div class="bg-cloud"></div><div class="bg-cloud"></div><div class="bg-cloud"></div>

<div class="correct-banner" id="correctBanner">Correct!</div>

<audio id="soundCorrect" src="./sound/correct.mp3" preload="auto"></audio>
<audio id="soundError" src="./sound/error.mp3" preload="auto"></audio>
<audio id="soundQuestion" src="./sound/Abigail-how are you today.mp3" preload="auto"></audio>
<audio id="soundImHappy" src="./sound/1309-im happy.mp3" preload="auto"></audio>
<audio id="soundImSad" src="./sound/1309-im sad.mp3" preload="auto"></audio>
<audio id="soundImAngry" src="./sound/1309-im angry.mp3" preload="auto"></audio>
<audio id="soundImSleepy" src="./sound/1309-im sleepy.mp3" preload="auto"></audio>

<div class="start-overlay" id="startOverlay">
    <div class="start-card"><h2>How are you today?</h2><button class="btn-start" id="btnStart">Start Game</button></div>
</div>

<div class="main-container">
    <div class="game-title"><h1>How are you today?</h1></div>
    <div class="progress-section">
        <div class="progress-info"><span>Progress</span><div class="progress-right"><span id="progressText">0 / 16</span><button class="btn-next" id="btnNext" style="display:none;">Next</button></div></div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
    </div>
    <div class="card-stage">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card-face card-front" id="cardFront"><img class="avatar-full" id="avatarImg" src="./img/Pam-happy.png" alt="角色心情圖片" /></div>
            <div class="card-face card-back" id="cardBack">
                <span class="im-label">I'm...</span><span class="emoji-big" id="backEmoji">😊</span><span class="answer-word happy" id="backWord">happy</span>
            </div>
        </div>
    </div>
    <div class="options-section" id="optionsSection">
        <button class="option-btn" data-mood="happy"><span class="option-emoji">😊</span> happy</button>
        <button class="option-btn" data-mood="sad"><span class="option-emoji">😢</span> sad</button>
        <button class="option-btn" data-mood="angry"><span class="option-emoji">😠</span> angry</button>
        <button class="option-btn" data-mood="sleepy"><span class="option-emoji">😴</span> sleepy</button>
    </div>
    <div class="feedback-area" id="feedbackArea"></div>
</div>

<div class="completion-overlay" id="completionOverlay">
    <div class="completion-card">
        <div class="trophy">🏆</div><h2>Great job!</h2>
        <div class="completion-stats" id="completionStats">Completed all <strong>16</strong> questions!<br>Accuracy: <strong id="finalAccuracy">100%</strong></div>
        <button class="btn-next" id="btnRestart" style="font-size:1.2rem; padding:14px 32px; background:#e8698a; height:auto; border-radius:32px;">🔄 Play Again</button>
    </div>
</div>
<div class="confetti-container" id="confettiContainer"></div>

<script>
    (function() {
        const characters = ['Pam', 'Bob', 'Vic', 'Tim'];
        const moods = ['happy', 'sad', 'angry', 'sleepy'];
        const moodInfo = {
            happy: { emoji: '😊', color: '#e8698a' }, sad: { emoji: '😢', color: '#5c8dcb' },
            angry: { emoji: '😠', color: '#d94a5a' }, sleepy: { emoji: '😴', color: '#7c6dad' }
        };

        const imageCache = {};
        function preloadImages() {
            const promises = [];
            for (const char of characters) for (const mood of moods) {
                const src = `./img/${char}-${mood}.png`;
                const img = new Image();
                const promise = new Promise((resolve) => { img.onload = () => resolve(); img.onerror = () => resolve(); if (img.complete) resolve(); });
                img.src = src; imageCache[`${char}-${mood}`] = img; promises.push(promise);
            }
            return Promise.all(promises);
        }

        const fixedBlocks = [
            [{ character: 'Pam', mood: 'happy', id: 'Pam-happy' }, { character: 'Bob', mood: 'sad', id: 'Bob-sad' }, { character: 'Vic', mood: 'angry', id: 'Vic-angry' }, { character: 'Tim', mood: 'sleepy', id: 'Tim-sleepy' }],
            [{ character: 'Vic', mood: 'happy', id: 'Vic-happy' }, { character: 'Tim', mood: 'sad', id: 'Tim-sad' }, { character: 'Pam', mood: 'angry', id: 'Pam-angry' }, { character: 'Bob', mood: 'sleepy', id: 'Bob-sleepy' }],
            [{ character: 'Bob', mood: 'happy', id: 'Bob-happy' }, { character: 'Pam', mood: 'sad', id: 'Pam-sad' }, { character: 'Tim', mood: 'angry', id: 'Tim-angry' }, { character: 'Vic', mood: 'sleepy', id: 'Vic-sleepy' }],
            [{ character: 'Tim', mood: 'happy', id: 'Tim-happy' }, { character: 'Vic', mood: 'sad', id: 'Vic-sad' }, { character: 'Bob', mood: 'angry', id: 'Bob-angry' }, { character: 'Pam', mood: 'sleepy', id: 'Pam-sleepy' }]
        ];

        function shuffleArray(arr) {
            const s = [...arr];
            for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
            return s;
        }

        function isSequenceValid(cards) {
            for (let i = 1; i < cards.length; i++) {
                if (cards[i].character === cards[i-1].character || cards[i].mood === cards[i-1].mood) return false;
            }
            return true;
        }

        function getShuffledDeck() {
            const maxAttempts = 1000;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const blocks = fixedBlocks.map(block => shuffleArray(block));
                const combined = [].concat(...blocks);
                if (isSequenceValid(combined)) {
                    console.log('📦 分區隨機順序:');
                    for (let b = 0; b < 4; b++) {
                        const ids = blocks[b].map(c => c.id);
                        console.log(`  ${String.fromCharCode(65 + b)}區 (題${b*4+1}-${(b+1)*4}): ${ids.join(', ')}`);
                    }
                    console.log('🔁 整體順序:', combined.map(c => c.id).join(' → '));
                    console.log('✅ 唯一性檢查通過，共 16 張卡片');
                    return combined;
                }
            }
            const fallback = [].concat(...fixedBlocks);
            console.warn('未能找到合規的隨機排列，使用原始順序');
            return fallback;
        }

        let cardQueue, currentCard;
        let correctCount = 0, totalAttempts = 0;
        let isFlipped = false, isAnswered = false, gameCompleted = false;

        const cardWrapper = document.getElementById('cardWrapper');
        const avatarImg = document.getElementById('avatarImg');
        const backEmoji = document.getElementById('backEmoji');
        const backWord = document.getElementById('backWord');
        const optionBtns = document.querySelectorAll('.option-btn');
        const btnNext = document.getElementById('btnNext');
        const feedbackArea = document.getElementById('feedbackArea');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const completionOverlay = document.getElementById('completionOverlay');
        const completionStats = document.getElementById('completionStats');
        const finalAccuracy = document.getElementById('finalAccuracy');
        const btnRestart = document.getElementById('btnRestart');
        const confettiContainer = document.getElementById('confettiContainer');
        const correctBanner = document.getElementById('correctBanner');

        const soundCorrect = document.getElementById('soundCorrect');
        const soundError = document.getElementById('soundError');
        const soundQuestion = document.getElementById('soundQuestion');
        const startOverlay = document.getElementById('startOverlay');
        const btnStart = document.getElementById('btnStart');
        const imAudioMap = {
            happy: document.getElementById('soundImHappy'), sad: document.getElementById('soundImSad'),
            angry: document.getElementById('soundImAngry'), sleepy: document.getElementById('soundImSleepy')
        };

        function preloadAllAudio() {
            const allAudio = [soundCorrect, soundError, soundQuestion, ...Object.values(imAudioMap)];
            const promises = allAudio.map(audio => new Promise((resolve) => {
                if (audio.readyState >= 2) { resolve(); return; }
                const onCanPlay = () => { audio.removeEventListener('canplaythrough', onCanPlay); resolve(); };
                audio.addEventListener('canplaythrough', onCanPlay);
                setTimeout(() => { audio.removeEventListener('canplaythrough', onCanPlay); resolve(); }, 2000);
                audio.load();
            }));
            return Promise.all(promises);
        }

        function updateCardDisplay() {
            if(!currentCard) return;
            backEmoji.textContent = moodInfo[currentCard.mood].emoji;
            backWord.textContent = currentCard.mood;
            backWord.className = 'answer-word ' + currentCard.mood;
            avatarImg.src = ''; requestAnimationFrame(() => { avatarImg.src = `./img/${currentCard.character}-${currentCard.mood}.png`; });
        }

        function playAudio(audioElement) { if (audioElement) { audioElement.currentTime = 0; audioElement.play().catch(() => {}); } }

        function updateProgress() {
            const remaining = cardQueue.length + (currentCard && !isAnswered ? 1 : 0);
            const done = 16 - remaining;
            progressBar.style.width = `${Math.round((done/16)*100)}%`;
            progressText.textContent = `${done} / 16`;
        }

        function loadNextCard() {
            if(cardQueue.length === 0) { completeGame(); return; }
            resetCardState(); btnNext.style.display = 'none';
            feedbackArea.textContent = ''; feedbackArea.className = 'feedback-area';
            setTimeout(() => {
                currentCard = cardQueue.shift(); isFlipped = false; isAnswered = false;
                updateCardDisplay(); updateProgress();
                optionBtns.forEach(b => { b.className = 'option-btn'; b.disabled = false; });
                playAudio(soundQuestion);
            }, 300);
        }

        function resetCardState() { cardWrapper.classList.remove('flipped'); isFlipped = false; }

        function checkAnswer(selectedMood) {
            if(!currentCard || isAnswered) return;
            const correct = currentCard.mood.toLowerCase(); totalAttempts++;
            optionBtns.forEach(b => { if(b.dataset.mood === selectedMood) b.classList.add(selectedMood === correct ? 'correct-selected' : 'wrong-selected'); });
            if(selectedMood === correct) {
                isAnswered = true; correctCount++;
                feedbackArea.textContent = '🎉 Correct!'; feedbackArea.className = 'feedback-area correct-fb';
                optionBtns.forEach(b => b.disabled = true); updateProgress();
                playAudio(soundCorrect);
                correctBanner.classList.add('show'); setTimeout(() => correctBanner.classList.remove('show'), 1200);
                spawnMiniConfetti();
                setTimeout(() => {
                    if(currentCard && isAnswered && !isFlipped) {
                        cardWrapper.classList.add('flipped'); isFlipped = true; btnNext.style.display = 'inline-flex';
                        playAudio(imAudioMap[currentCard.mood]);
                    }
                }, 900);
            } else {
                feedbackArea.textContent = '❌ Try again!'; feedbackArea.className = 'feedback-area error-fb';
                playAudio(soundError);
                setTimeout(() => { if(!isAnswered) optionBtns.forEach(b => b.classList.remove('wrong-selected')); }, 600);
            }
        }

        function completeGame() {
            gameCompleted = true;
            const accuracy = totalAttempts > 0 ? Math.round((correctCount/totalAttempts)*100) : 100;
            finalAccuracy.textContent = accuracy + '%';
            completionStats.innerHTML = `Completed all <strong>16</strong> questions!<br>Correct: <strong>${correctCount}</strong><br>Total tries: <strong>${totalAttempts}</strong><br>Accuracy: <strong>${accuracy}%</strong>`;
            completionOverlay.classList.add('show'); spawnBigConfetti();
            progressBar.style.width = '100%'; progressText.textContent = '16 / 16'; btnNext.style.display = 'none';
        }

        function resetGame() {
            cardQueue = getShuffledDeck();
            correctCount = 0; totalAttempts = 0; gameCompleted = false;
            currentCard = null; isFlipped = false; isAnswered = false;
            completionOverlay.classList.remove('show'); resetCardState(); updateProgress();
            btnNext.style.display = 'none'; loadNextCard();
        }

        async function startGame() {
            startOverlay.style.display = 'none';
            await Promise.all([preloadImages(), preloadAllAudio()]);
            resetGame();
        }

        btnStart.addEventListener('click', startGame);
        optionBtns.forEach(btn => btn.addEventListener('click', function() {
            if(isAnswered || this.disabled) return;
            checkAnswer(this.dataset.mood);
        }));
        btnNext.addEventListener('click', () => loadNextCard());
        btnRestart.addEventListener('click', () => { completionOverlay.classList.remove('show'); startOverlay.style.display = 'flex'; });

        function spawnMiniConfetti() {
            const colors=['#f9c74f','#ff7043','#81c784','#64b5f6','#f48fb1','#ba68c8','#ffb74d','#4db6ac'];
            const frag=document.createDocumentFragment();
            for(let i=0;i<25;i++){ const p=document.createElement('div'); p.className='confetti-piece'; p.style.left=(35+Math.random()*30)+'%'; p.style.top='-30px'; p.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)]; p.style.width=(8+Math.random()*10)+'px'; p.style.height=(8+Math.random()*10)+'px'; p.style.animationDuration=(1.8+Math.random()*2.2)+'s'; p.style.animationDelay=Math.random()*0.5+'s'; frag.appendChild(p); }
            confettiContainer.appendChild(frag); setTimeout(()=>{ confettiContainer.innerHTML=''; },3500);
        }
        function spawnBigConfetti() {
            const colors=['#f9c74f','#ff7043','#81c784','#64b5f6','#f48fb1','#ba68c8','#ffb74d','#4db6ac','#ef5350','#ab47bc'];
            const frag=document.createDocumentFragment();
            for(let i=0;i<90;i++){ const p=document.createElement('div'); p.className='confetti-piece'; p.style.left=Math.random()*100+'%'; p.style.top=-(Math.random()*70)+'px'; p.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)]; p.style.width=(10+Math.random()*16)+'px'; p.style.height=(10+Math.random()*16)+'px'; p.style.animationDuration=(2.5+Math.random()*3.5)+'s'; p.style.animationDelay=Math.random()*1.5+'s'; p.style.borderRadius=Math.random()>0.5?'50%':'4px'; frag.appendChild(p); }
            confettiContainer.appendChild(frag); setTimeout(()=>{ confettiContainer.innerHTML=''; },5000);
        }
    })();
</script>
